name: Build & deploy Kubernetes API docs

on:
  schedule:
    # Once a day. GitHub sometimes delays scheduled runs by a few minutes -
    # that's fine, this only needs to notice new releases eventually.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      k8s_versions:
        description: 'Comma-separated versions to build, e.g. "1.34,1.35,1.36" (minor -> latest patch) or "v1.34.10" (exact). Leave empty to use the K8S_VERSIONS repo variable, or the single latest stable release if that is unset too.'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/build-and-deploy.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch OpenAPI spec(s)
        env:
          K8S_VERSIONS: ${{ inputs.k8s_versions || vars.K8S_VERSIONS }}
        run: node scripts/fetch-specs.mjs

      - name: Check whether tracked version(s) changed
        id: diff
        run: |
          git add .k8s-versions.json
          if git diff --cached --quiet -- .k8s-versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version(s) changed:"
            git diff --cached -- .k8s-versions.json
          fi

      - name: Generate reference pages
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: node scripts/gen-reference.mjs

      - uses: actions/configure-pages@v5
        if: steps.diff.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: build

      - id: deployment
        if: steps.diff.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4

      - name: Commit updated version marker
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump tracked Kubernetes version(s)"
          git push
